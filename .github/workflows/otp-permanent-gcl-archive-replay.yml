name: OTP Permanent GCL archival replay

on:
  push:
    branches:
      - agent/otp-c-permanent-replay-001
    paths:
      - ".github/workflows/otp-permanent-gcl-archive-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-family-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: otp-c-permanent-source-e62211d2-candidate-001
      SOURCE_ASSET: openai-ten-proofs-e62211d2.tar
      PROTECTED_ARCHIVE_SHA256: 3022e62ffbed8f5f74d232034a703dc645e6b301879dff1e87df72979914294f
      PROTECTED_ARCHIVE_BYTES: "21022720"
      PERMANENT_SHA256: 3bd469c20bc2277a13be3f9353ce47ad0c2070a330355daa78a9e59f1ca1d3c6
      CHALLENGE_SHA256: fc97578bcbb072ff82383e4c903107130ba3dd1a2209235ab32270c7df37f83d
      CONFIG_SHA256: f80482f4a163041e036e26bb687690559cc36504e347b0ea3df0d626cfb965bb
      TOOLCHAIN_SHA256: 2773c517aa90b66ea8a2c52bddddf84393157797f8341be0df45294fff7fd32e
      LAKE_MANIFEST_SHA256: a6faf8302fe77f77f499446c27b8829b1af8dbc7847298b682556baa2a0b135e
    steps:
      - name: Download protected source from GCL archival carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo grandchallenge/MATHFORGE \
            --pattern "$SOURCE_ASSET"
          actual_sha="$(sha256sum "$SOURCE_ASSET" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$SOURCE_ASSET" | tr -d ' ')"
          printf 'archive_sha256=%s\narchive_bytes=%s\n' "$actual_sha" "$actual_bytes"
          test "$actual_sha" = "$PROTECTED_ARCHIVE_SHA256"
          test "$actual_bytes" = "$PROTECTED_ARCHIVE_BYTES"

      - name: Extract protected source and verify Permanent-family identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          tar -xf "$SOURCE_ASSET" -C source --strip-components=1
          test "$(sha256sum source/Permanent.lean | awk '{print $1}')" = "$PERMANENT_SHA256"
          test "$(sha256sum source/ComparatorChallenges/C_PermanentFormulaLowerBound.lean | awk '{print $1}')" = "$CHALLENGE_SHA256"
          test "$(sha256sum source/ComparatorChallenges/C_PermanentFormulaLowerBound.json | awk '{print $1}')" = "$CONFIG_SHA256"
          test "$(sha256sum source/lean-toolchain | awk '{print $1}')" = "$TOOLCHAIN_SHA256"
          test "$(sha256sum source/lake-manifest.json | awk '{print $1}')" = "$LAKE_MANIFEST_SHA256"
          test "$(cat source/lean-toolchain)" = "leanprover/lean4:v4.32.0"

      - name: Verify exact protected Comparator inventory
        shell: python
        run: |
          import json
          from pathlib import Path
          cfg = json.loads(Path("source/ComparatorChallenges/C_PermanentFormulaLowerBound.json").read_text(encoding="utf-8"))
          assert cfg["solution_module"] == "Permanent"
          assert cfg["theorem_names"] == [
              "PermanentFormulaLowerBound.permanent_divisionFree_formula_logarithmic_lower_bound",
              "PermanentFormulaLowerBound.permanent_rational_formula_logarithmic_lower_bound",
          ]
          assert len(cfg["theorem_names"]) == 2
          text = Path("source/ComparatorChallenges/C_PermanentFormulaLowerBound.lean").read_text(encoding="utf-8")
          for marker in [
              "32 <= n",
              "Formula (Fin n × Fin n) ℂ",
              "Formula.eval f = permanentPolynomial n",
              "RationalFormula (Fin n × Fin n) ℂ",
              "RationalFormula.Valid f",
              "RationalFormula.eval f =",
          ]:
              assert marker in text, marker

      - name: Install repository-pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.32.0

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd source
          elan show
          lean --version
          lake --version

      - name: Fetch locked mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          cd source
          lake exe cache get

      - name: Build isolated Permanent solution module
        shell: bash
        run: |
          set -euo pipefail
          cd source
          lake build Permanent

      - name: Elaborate isolated Permanent challenge interface
        shell: bash
        run: |
          set -euo pipefail
          cd source
          lake env lean ComparatorChallenges/C_PermanentFormulaLowerBound.lean

      - name: Emit replay clearance marker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FRESH_FAMILY_REPLAY_CLEAR__SEMANTIC_AUDIT_NOT_YET_PERFORMED' \
            'source_carrier=grandchallenge/MATHFORGE release otp-c-permanent-source-e62211d2-candidate-001 asset 514295009' \
            'archive_sha256=3022e62ffbed8f5f74d232034a703dc645e6b301879dff1e87df72979914294f' \
            'target_count=2' \
            'circuit_target_count=0' \
            'semantic_clearance=false'
