name: Formal Conjectures replay

on:
  pull_request:
    paths:
      - ".github/workflows/formal-conjectures-replay.yml"
      - "catalog/**"
      - "governance/external_sources.json"
      - "formal_sources/formal_conjectures/**"
      - "schemas/**"
      - "tests/**"
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-conjectures-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout MATHFORGE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked catalog validation dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Checkout pinned Formal Conjectures revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: google-deepmind/formal-conjectures
          ref: 85f863718beeec7b58a3a1926ee92e3472bc2020
          path: upstream/formal-conjectures
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned upstream commit
        run: |
          set -euo pipefail
          test "$(git -C upstream/formal-conjectures rev-parse HEAD)" = "85f863718beeec7b58a3a1926ee92e3472bc2020"

      - name: Install pinned elan bootstrap
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore pinned replay build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            upstream/formal-conjectures/.lake/build
            ~/.cache/mathlib
          key: formal-conjectures-85f863718beeec7b58a3a1926ee92e3472bc2020-lean4.27.0-${{ runner.os }}

      - name: Restore pinned mathlib cache and build extractor environment
        working-directory: upstream/formal-conjectures
        run: |
          set -euo pipefail
          lake exe cache get
          lake build FormalConjecturesAnswerPostpone

      - name: Replay selected governed extraction
        run: |
          set -euo pipefail
          mkdir -p replay
          python formal_sources/formal_conjectures/intake.py intake \
            --source-lock formal_sources/formal_conjectures/source_locks/FC-GDM-002.json \
            --checkout upstream/formal-conjectures \
            --output replay/FC-GDM-002-ACTIVE-CAMPAIGN-EXPANSION.json \
            --generated-at 2026-07-30T12:15:00Z \
            --skip-build

      - name: Replay repository-wide metadata inventory
        working-directory: upstream/formal-conjectures
        run: |
          set -euo pipefail
          lake exe extract_names FormalConjectures \
            --exclude=docstring,moduleDocstrings \
            > ../../replay/FC-GDM-002-FULL-INVENTORY.json

      - name: Replay complete two-provider semantic catalog
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://huggingface.co/datasets/amphora/ResearchMath-14k/resolve/f22d0f28b55e6e777acf82e722d97ae982dff02e/data/train.jsonl \
            --output replay/researchmath-train.jsonl
          test "$(sha256sum replay/researchmath-train.jsonl | cut -d' ' -f1)" = "3f6c96d18925a47ac223555717226c5408cc9c75e07a1e96bddcffde8a06f029"
          python catalog/build_semantic_catalog.py build-researchmath --input replay/researchmath-train.jsonl
          python catalog/build_semantic_catalog.py build-formal-conjectures \
            --checkout upstream/formal-conjectures \
            --inventory replay/FC-GDM-002-FULL-INVENTORY.json
          python catalog/build_semantic_catalog.py finalize
          python catalog/build_semantic_catalog.py verify
          git diff --exit-code -- catalog governance/external_sources.json schemas

      - name: Build deterministic inventory screen
        run: |
          set -euo pipefail
          python formal_sources/formal_conjectures/screen_inventory.py \
            --inventory replay/FC-GDM-002-FULL-INVENTORY.json \
            --upstream-commit 85f863718beeec7b58a3a1926ee92e3472bc2020 \
            --output replay/FC-GDM-002-INVENTORY-SCREEN.json

      - name: Resolve immutable benchmark tag relation
        run: |
          set -euo pipefail
          python formal_sources/formal_conjectures/resolve_benchmark_tag.py \
            --repository upstream/formal-conjectures \
            --commit 85f863718beeec7b58a3a1926ee92e3472bc2020 \
            --output replay/FC-GDM-002-TAG-RESOLUTION.json

      - name: Record replay identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("replay")
          records = []
          for path in sorted(root.glob("*.json")):
              data = path.read_bytes()
              parsed = json.loads(data)
              records.append({
                  "path": path.as_posix(),
                  "byte_length": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "problem_count": len(parsed.get("problems", [])) if isinstance(parsed, dict) else None,
                  "statement_count": len(parsed.get("statements", [])) if isinstance(parsed, dict) else None,
              })
          manifest = {
              "schema_version": "1.0.0",
              "upstream_repository": "google-deepmind/formal-conjectures",
              "upstream_commit": "85f863718beeec7b58a3a1926ee92e3472bc2020",
              "lean_toolchain": "leanprover/lean4:v4.27.0",
              "mathlib_revision": "v4.27.0",
              "records": records,
          }
          (root / "REPLAY_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload exact replay and admission-candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-conjectures-expanded-replay
          path: |
            replay
            catalog/manifest.json
            catalog/providers
          if-no-files-found: error
          retention-days: 14
