name: OTP source PDF successor 002

on:
  pull_request:
    paths:
      - '.github/workflows/otp-source-pdf-successor-002.yml'
      - 'sources/OPENAI-TEN-PROOFS-001/pdf_source_successors/**'
      - 'schemas/openai_ten_proofs_pdf_source_successor.schema.json'
      - 'ci/validate_openai_ten_proofs_pdf_source_successor.py'
      - 'tests/test_openai_ten_proofs_pdf_source_successor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-pdf-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independently acquire current official PDF twice
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.openai.com/pdf/ten-proofs-oai.pdf'
          curl --fail --location --retry 3 --silent --show-error --dump-header "$RUNNER_TEMP/headers1.txt" --output "$RUNNER_TEMP/one.pdf" "$URL"
          sleep 2
          curl --fail --location --retry 3 --silent --show-error --dump-header "$RUNNER_TEMP/headers2.txt" --output "$RUNNER_TEMP/two.pdf" "$URL"
          SHA1="$(sha256sum "$RUNNER_TEMP/one.pdf" | awk '{print $1}')"
          SHA2="$(sha256sum "$RUNNER_TEMP/two.pdf" | awk '{print $1}')"
          BYTES1="$(stat -c %s "$RUNNER_TEMP/one.pdf")"
          BYTES2="$(stat -c %s "$RUNNER_TEMP/two.pdf")"
          test "$SHA1" = "$SHA2"
          test "$BYTES1" = "$BYTES2"
          LASTMOD="$(grep -i '^last-modified:' "$RUNNER_TEMP/headers1.txt" | tail -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r' || true)"
          ETAG="$(grep -i '^etag:' "$RUNNER_TEMP/headers1.txt" | tail -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r' || true)"
          echo "::notice title=OTP current PDF identity::sha256=$SHA1 bytes=$BYTES1 last_modified=$LASTMOD etag=$ETAG"
          echo "OTP_CURRENT_PDF_SHA256=$SHA1"
          echo "OTP_CURRENT_PDF_BYTES=$BYTES1"
          python - <<'PY'
          import os
          from pathlib import Path
          data = (Path(os.environ['RUNNER_TEMP']) / 'one.pdf').read_bytes()
          assert data.startswith(b'%PDF-')
          assert b'%%EOF' in data[-1024:]
          PY
      - name: Validate closed successor record when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f sources/OPENAI-TEN-PROOFS-001/pdf_source_successors/OTP-SOURCE-PDF-SUCCESSOR-002.json; then
            python ci/validate_openai_ten_proofs_pdf_source_successor.py
            python -m unittest tests.test_openai_ten_proofs_pdf_source_successor -v
          else
            echo 'Probe phase: closed successor record not yet present.'
          fi
