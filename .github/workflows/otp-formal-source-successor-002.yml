name: OTP formal source successor 002

on:
  pull_request:
    paths:
      - '.github/workflows/otp-formal-source-successor-002.yml'
      - 'ci/otp_landrun_argv_adapter.sh'
      - 'ci/audit_openai_ten_proofs_successor_upstream.py'
      - 'sources/OPENAI-TEN-PROOFS-001/formal_source_successors/**'
      - 'schemas/openai_ten_proofs_formal_source_successor.schema.json'
      - 'ci/validate_openai_ten_proofs_formal_source_successor.py'
      - 'tests/test_openai_ten_proofs_formal_source_successor.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otp-formal-source-successor-002-${{ github.ref }}
  cancel-in-progress: true

jobs:
  successor-record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Validate closed successor record
        run: |
          python ci/validate_openai_ten_proofs_formal_source_successor.py
          python -m unittest tests.test_openai_ten_proofs_formal_source_successor -v
          python -m json.tool schemas/openai_ten_proofs_formal_source_successor.schema.json > ${{ runner.temp }}/schema.json
          python -m json.tool sources/OPENAI-TEN-PROOFS-001/formal_source_successors/OTP-FORMAL-SOURCE-SUCCESSOR-002.json > ${{ runner.temp }}/record.json

  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openai/ten-proofs
          ref: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact upstream identity and deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6"
          test "$(git -C upstream rev-parse 'HEAD^{tree}')" = "174289e4d4958cb0509874e6e53400e098213de7"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.32.0"
          test "$(git -C upstream hash-object lean-toolchain)" = "94b9f495baff80fd9cb44aad8f4762cb3b2066fe"
          test "$(git -C upstream hash-object lakefile.toml)" = "f29d6b0307597932154b34b97e37fe07ec3356de"
          test "$(git -C upstream hash-object lake-manifest.json)" = "046e8de7f46832fbf092e3fb815efae01e4a2129"
          archive_sha256="$(git -C upstream archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          test "$archive_sha256" = "64534bbf7e1a5cc5f8c902d81657fb67c3dd9991d01f8a8b9e6803b163f3f532"
          printf 'OTP_SUCCESSOR_ROOT=%s\n' "$(git -C upstream rev-parse HEAD)"
          printf 'OTP_SUCCESSOR_TREE=%s\n' "$(git -C upstream rev-parse 'HEAD^{tree}')"
          printf 'OTP_SUCCESSOR_ARCHIVE_SHA256=%s\n' "$archive_sha256"
          printf 'OTP_SUCCESSOR_LEAN_TOOLCHAIN=%s\n' "$(cat upstream/lean-toolchain)"
          git -C upstream status --porcelain=v1

  family-comparator:
    needs: source-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: OTP-A-SPHERE-PACKING
            config: A_SpherePacking.json
          - family: OTP-B1-BINARY-CODES
            config: B_BinaryCodes.json
          - family: OTP-B2-SPHERICAL-CODES
            config: B_SphericalCodes.json
          - family: OTP-D-NON-SOFIC
            config: D_NonSoficGroup.json
          - family: OTP-E-CONNES-RIGIDITY
            config: E_ConnesRigidity.json
          - family: OTP-G-QUANTUM-PARALLEL-REPETITION
            config: G_QuantumParallelRepetition.json
          - family: OTP-H-GAPCVP
            config: H_GapCVP.json
          - family: OTP-I-RAMSEY
            config: I_MulticolorTriangleRamsey.json
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openai/ten-proofs
          ref: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Zouuup/landrun
          ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          path: landrun-src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean4export
          ref: 4e7915201d3f9f04470d9eae002fa695f7cdc589
          path: lean4export-src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ammkrn/nanoda_lib
          ref: ddfac2bf5a7b56cb46e141494427ff3dd55963c7
          path: nanoda-src
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact replay TCB source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6"
          test "$(git -C landrun-src rev-parse HEAD)" = "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"
          test "$(git -C lean4export-src rev-parse HEAD)" = "4e7915201d3f9f04470d9eae002fa695f7cdc589"
          test "$(git -C nanoda-src rev-parse HEAD)" = "ddfac2bf5a7b56cb46e141494427ff3dd55963c7"
          go version
          rustc --version
          cargo --version
      - name: Assert exact family source bytes and structural scan
        run: python ci/audit_openai_ten_proofs_successor_upstream.py verify --root upstream --family '${{ matrix.family }}'
      - uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: upstream
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Emit and validate theorem-level axiom report
        shell: bash
        run: |
          set -euo pipefail
          audit_file="upstream/OTPSourceSuccessorAxiomAudit.lean"
          audit_log="${RUNNER_TEMP}/otp_axioms_${{ matrix.family }}.log"
          python ci/audit_openai_ten_proofs_successor_upstream.py write-axiom-audit --root upstream --family '${{ matrix.family }}' --output "$audit_file"
          (cd upstream && lake env lean OTPSourceSuccessorAxiomAudit.lean) 2>&1 | tee "$audit_log"
          python ci/audit_openai_ten_proofs_successor_upstream.py check-axiom-log --family '${{ matrix.family }}' --log "$audit_log"
          rm -f "$audit_file"
      - name: Build pinned Comparator helper binaries
        shell: bash
        run: |
          set -euo pipefail
          (cd landrun-src && go build -trimpath -o ../landrun ./cmd/landrun)
          (cd lean4export-src && lake build)
          (cd nanoda-src && cargo build --release --locked)
          chmod +x ci/otp_landrun_argv_adapter.sh
          test -x landrun
          test -x lean4export-src/.lake/build/bin/lean4export
          test -x nanoda-src/target/release/nanoda_bin
          test -x ci/otp_landrun_argv_adapter.sh
          test "$(sha256sum landrun | awk '{print $1}')" = "a4ba9ed1b6b53f9cfd57b9fb1e4f8f3c3ab69cf6a0147764ff70303a8306f858"
          test "$(sha256sum lean4export-src/.lake/build/bin/lean4export | awk '{print $1}')" = "e57369980b0b81228580ce08066fb9bd738e717e002673a143f4956d217266b0"
          test "$(sha256sum nanoda-src/target/release/nanoda_bin | awk '{print $1}')" = "60cc30add2758abce965f122b4e85f1fdd7c23607ea67680cec6721aa2ef23f0"
          test "$(sha256sum ci/otp_landrun_argv_adapter.sh | awk '{print $1}')" = "84d900d75bdc76c2c4168484a929e448be36fca20d093c42cac15ed923fe3f1d"
      - name: Exact isolated Comparator replay — ${{ matrix.family }}
        env:
          REAL_LANDRUN: ${{ github.workspace }}/landrun
          COMPARATOR_LANDRUN: ${{ github.workspace }}/ci/otp_landrun_argv_adapter.sh
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/lean4export-src/.lake/build/bin/lean4export
          COMPARATOR_NANODA: ${{ github.workspace }}/nanoda-src/target/release/nanoda_bin
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6"
          printf 'OTP_SUCCESSOR_FAMILY=%s\n' '${{ matrix.family }}'
          printf 'OTP_SUCCESSOR_CONFIG=%s\n' '${{ matrix.config }}'
          lake exe comparator 'ComparatorChallenges/${{ matrix.config }}'
          printf 'OTP_SUCCESSOR_COMPARATOR=ACCEPT\n'
