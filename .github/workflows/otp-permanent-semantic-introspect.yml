name: OTP Permanent semantic witness probe

on:
  push:
    branches:
      - agent/otp-c-permanent-semantic-001
    paths:
      - ".github/workflows/otp-permanent-semantic-introspect.yml"
      - "sources/OPENAI-TEN-PROOFS-001/semantic/OTP-C-PERMANENT/PermanentFormulaNonvacuity.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-nonvacuity-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: otp-c-permanent-source-e62211d2-candidate-001
      SOURCE_ASSET: openai-ten-proofs-e62211d2.tar
      PROTECTED_ARCHIVE_SHA256: 3022e62ffbed8f5f74d232034a703dc645e6b301879dff1e87df72979914294f
      PROTECTED_ARCHIVE_BYTES: "21022720"
    steps:
      - name: Checkout MATHFORGE witness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download and verify exact protected archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo grandchallenge/MATHFORGE --pattern "$SOURCE_ASSET"
          test "$(sha256sum "$SOURCE_ASSET" | awk '{print $1}')" = "$PROTECTED_ARCHIVE_SHA256"
          test "$(wc -c < "$SOURCE_ASSET" | tr -d ' ')" = "$PROTECTED_ARCHIVE_BYTES"
          mkdir source
          tar -xf "$SOURCE_ASSET" -C source --strip-components=1
          cp sources/OPENAI-TEN-PROOFS-001/semantic/OTP-C-PERMANENT/PermanentFormulaNonvacuity.lean \
            source/PermanentFormulaNonvacuity.lean

      - name: Verify protected source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum source/ComparatorChallenges/C_PermanentFormulaLowerBound.lean | awk '{print $1}')" = \
            "fc97578bcbb072ff82383e4c903107130ba3dd1a2209235ab32270c7df37f83d"
          test "$(sha256sum source/lean-toolchain | awk '{print $1}')" = \
            "2773c517aa90b66ea8a2c52bddddf84393157797f8341be0df45294fff7fd32e"
          test "$(sha256sum source/lake-manifest.json | awk '{print $1}')" = \
            "a6faf8302fe77f77f499446c27b8829b1af8dbc7847298b682556baa2a0b135e"

      - name: Install pinned elan bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore pinned mathlib cache and build protected challenge module
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake build ComparatorChallenges.C_PermanentFormulaLowerBound

      - name: Exact Lean replay of nonvacuity witness
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake env lean PermanentFormulaNonvacuity.lean
          echo "PERMANENT_FORMULA_NONVACUITY_WITNESS_EXACT_REPLAY_CLEAR"
