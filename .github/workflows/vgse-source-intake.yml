name: VGSE source intake

on:
  pull_request:
    paths:
      - ".github/workflows/vgse-source-intake.yml"
      - "sources/VGSE-001/**"
      - "provider_manifests/VGSE-001.json"
      - "tools/verify_vgse_source_concordance.py"
      - "tools/audit_vgse_arxiv_source_archive.py"
      - "tools/classify_vgse_varchenko_weight_semantics.py"
      - "tools/verify_vgse_arxiv_source_archive_record.py"
      - "tests/test_vgse_source_concordance.py"
      - "tests/test_vgse_arxiv_source_archive.py"
      - "tests/test_vgse_varchenko_weight_semantics.py"
      - "governance/provider_coverage.json"
      - "schemas/provider_coverage.schema.json"
      - "ci/validate_forge.py"

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Acquire independent source bytes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://www.math.ucla.edu/~galashin/papers/t_embeddings_v2.pdf \
            --output /tmp/vgse-author.pdf
          curl --fail --location --retry 3 --silent --show-error \
            https://arxiv.org/pdf/2410.09574v2 \
            --output /tmp/vgse-arxiv-v2.pdf
          curl --fail --location --retry 3 --silent --show-error \
            https://arxiv.org/e-print/2410.09574v2 \
            --output /tmp/vgse-arxiv-v2-source
      - name: Verify bytes, PDF structure, and revision concordance
        run: |
          python tools/verify_vgse_source_concordance.py \
            --author-pdf /tmp/vgse-author.pdf \
            --arxiv-pdf /tmp/vgse-arxiv-v2.pdf \
            --record sources/VGSE-001/source_revision_concordance.json \
            | tee /tmp/vgse-source-verification.json
      - name: Audit arXiv source archive and Figure 16 lineage
        run: |
          python tools/audit_vgse_arxiv_source_archive.py \
            --source-archive /tmp/vgse-arxiv-v2-source \
            --output /tmp/vgse-arxiv-source-archive-audit.json \
            | tee /tmp/vgse-arxiv-source-archive-audit.stdout.json
      - name: Classify Varchenko weight equalities
        run: |
          python tools/classify_vgse_varchenko_weight_semantics.py \
            --source-archive /tmp/vgse-arxiv-v2-source \
            --output /tmp/vgse-varchenko-weight-semantics-audit.json \
            | tee /tmp/vgse-varchenko-weight-semantics-audit.stdout.json
      - name: Verify bound source-package provider record
        run: |
          python tools/verify_vgse_arxiv_source_archive_record.py \
            --source-archive /tmp/vgse-arxiv-v2-source \
            --record sources/VGSE-001/arxiv_v2_source_archive_audit.json
      - name: Run bounded source-archive parser tests
        run: |
          python -m unittest tests.test_vgse_arxiv_source_archive -v
          python -m unittest tests.test_vgse_varchenko_weight_semantics -v
      - name: Upload non-copyright verification records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vgse-source-verification
          path: |
            /tmp/vgse-source-verification.json
            /tmp/vgse-arxiv-source-archive-audit.json
            /tmp/vgse-varchenko-weight-semantics-audit.json
          if-no-files-found: error
          retention-days: 30
