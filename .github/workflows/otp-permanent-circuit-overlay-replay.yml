name: OTP Permanent circuit overlay replay

on:
  push:
    branches:
      - agent/otp-c-permanent-circuit-001
    paths:
      - ".github/workflows/otp-permanent-circuit-overlay-replay.yml"
      - "sources/OPENAI-TEN-PROOFS-001/target_overlays/OTP-C-PERMANENT-CIRCUIT/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-circuit-overlay-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: otp-c-permanent-source-e62211d2-candidate-001
      SOURCE_ASSET: openai-ten-proofs-e62211d2.tar
      PROTECTED_ARCHIVE_SHA256: 3022e62ffbed8f5f74d232034a703dc645e6b301879dff1e87df72979914294f
      PROTECTED_ARCHIVE_BYTES: "21022720"
      OVERLAY_ROOT: sources/OPENAI-TEN-PROOFS-001/target_overlays/OTP-C-PERMANENT-CIRCUIT
      CHALLENGE_STEM: GCL_C_PermanentCircuit
    steps:
      - name: Checkout MATHFORGE overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download and verify exact protected archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo grandchallenge/MATHFORGE --pattern "$SOURCE_ASSET"
          test "$(sha256sum "$SOURCE_ASSET" | awk '{print $1}')" = "$PROTECTED_ARCHIVE_SHA256"
          test "$(wc -c < "$SOURCE_ASSET" | tr -d ' ')" = "$PROTECTED_ARCHIVE_BYTES"
          mkdir source
          tar -xf "$SOURCE_ASSET" -C source --strip-components=1
          test "$(sha256sum source/Permanent.lean | awk '{print $1}')" = \
            "3bd469c20bc2277a13be3f9353ce47ad0c2070a330355daa78a9e59f1ca1d3c6"
          cp "$OVERLAY_ROOT/$CHALLENGE_STEM.lean" "source/ComparatorChallenges/$CHALLENGE_STEM.lean"
          cp "$OVERLAY_ROOT/$CHALLENGE_STEM.json" "source/ComparatorChallenges/$CHALLENGE_STEM.json"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore locked project cache
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          lean --version | grep -F "version 4.32.0"
          lake exe cache get

      - name: Build pinned Comparator toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools "$RUNNER_TEMP/otp-bin"

          git clone --filter=blob:none https://github.com/leanprover/lean4export.git tools/lean4export
          git -C tools/lean4export checkout --detach 4e7915201d3f9f04470d9eae002fa695f7cdc589
          (cd tools/lean4export && lake build)

          git clone --filter=blob:none https://github.com/ammkrn/nanoda_lib.git tools/nanoda
          git -C tools/nanoda checkout --detach ddfac2bf5a7b56cb46e141494427ff3dd55963c7
          (cd tools/nanoda && cargo build --release --locked)

          git clone --filter=blob:none https://github.com/Zouuup/landrun.git tools/landrun
          git -C tools/landrun checkout --detach 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd tools/landrun && go build -trimpath -o "$RUNNER_TEMP/otp-bin/landrun-real" ./cmd/landrun)

          cat > "$RUNNER_TEMP/otp-bin/landrun" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          real_landrun="${COMPARATOR_LANDRUN_REAL:-landrun-real}"
          prefix=()
          while (($#)); do
            case "$1" in
              --best-effort|-ldd|-add-exec) prefix+=("$1"); shift ;;
              --ro|--rw|--rwx|--rox|--env) prefix+=("$1" "$2"); shift 2 ;;
              --) shift; exec "$real_landrun" "${prefix[@]}" -- "$@" ;;
              *) exec "$real_landrun" "${prefix[@]}" -- "$@" ;;
            esac
          done
          exit 64
          EOF
          chmod +x "$RUNNER_TEMP/otp-bin/landrun" "$RUNNER_TEMP/otp-bin/landrun-real"

          echo "$RUNNER_TEMP/otp-bin" >> "$GITHUB_PATH"
          echo "COMPARATOR_LANDRUN=$RUNNER_TEMP/otp-bin/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_LANDRUN_REAL=$RUNNER_TEMP/otp-bin/landrun-real" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/tools/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$GITHUB_WORKSPACE/tools/nanoda/target/release/nanoda_bin" >> "$GITHUB_ENV"

      - name: Exact protected circuit solution and overlay replay
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          lake build Permanent
          lake env lean "ComparatorChallenges/$CHALLENGE_STEM.lean"
          cat > GCLPermanentCircuitAxioms.lean <<'EOF'
          import Permanent
          #print axioms PermanentRollout.permanent_circuit_loglog_lower_bound
          EOF
          lake env lean GCLPermanentCircuitAxioms.lean | tee /tmp/axioms.log
          rm GCLPermanentCircuitAxioms.lean
          ! grep -E "sorryAx|prohibited" /tmp/axioms.log
          lake exe comparator "ComparatorChallenges/$CHALLENGE_STEM.json" | tee /tmp/comparator.log
          grep -Fq "Lean default kernel accepts the solution" /tmp/comparator.log
          grep -Fq "Nanoda kernel accepts the solution" /tmp/comparator.log
          grep -Fq "Your solution is okay!" /tmp/comparator.log
          echo "PERMANENT_CIRCUIT_THEOREM_1_1_EXACT_OVERLAY_REPLAY_CLEAR"
