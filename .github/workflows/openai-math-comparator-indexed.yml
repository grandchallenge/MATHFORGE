name: OAI26 F379 split replay trusted challenge and checker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oai26-hierarchy-split-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: "4"
      UPSTREAM: "3344da59991ed94f9ba711217b29c1d760badfa6"
      COMPARATOR: "d03acab154d269c06e60e4de7e4cc85deebff94b"
      EXPORTER: "076e8e57707e813375e8f9da8bf989799ace9680"
      MATHLIB: "d13f23b723b8a846827a245b89c10fc7d3f11612"
    steps:
      - name: Build exact checker with data-only entrypoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence" "$RUNNER_TEMP/split"
          cd "$RUNNER_TEMP/split"
          curl -fsSL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.34.1
          lean +leanprover/lean4:v4.34.1 --version | tee "$GITHUB_WORKSPACE/evidence/lean-version.txt"
          git clone https://github.com/leanprover/comparator.git checker
          git -C checker checkout --detach "$COMPARATOR"
          test "$(git -C checker rev-parse HEAD)" = "$COMPARATOR"
          cd checker
          test "$(git hash-object Main.lean)" = 8560511ff73fbcd48e8d1abba2c22a976c52c393
          printf 'leanprover/lean4:v4.34.1\n' > lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Main.lean")
          orig=p.read_text()
          marker="def main (args : List String) : IO Unit := do"
          assert orig.count(marker)==1
          prefix=orig[:orig.index(marker)]
          new=prefix+"""def main (args : List String) : IO Unit := do
            let [configPath, challengePath, solutionPath] := args |
              throw <| IO.userError "Expected config, challenge export, solution export"
            let content ← IO.FS.readFile configPath
            let cfg : Comparator.Config ← IO.ofExcept <| Lean.FromJson.fromJson? <| ← IO.ofExcept <| Lean.Json.parse content
            let challenge ← IO.FS.readFile challengePath
            let solution ← IO.FS.readFile solutionPath
            Comparator.M.run (Comparator.verifyMatch challenge solution) cfg
            IO.println "GCL SPLIT REPLAY ACCEPTED"
          """
          Path("SplitReplay.lean").write_text(new)
          assert Path("SplitReplay.lean").read_text().startswith(prefix)
          p=Path("lakefile.toml")
          s=p.read_text()
          assert s.count('rev = "master"')==1
          p.write_text(s.replace('rev = "master"', 'rev = "076e8e57707e813375e8f9da8bf989799ace9680"') + '\n[[lean_exe]]\nname = "splitReplay"\nroot = "SplitReplay"\n')
          PY
          lake update
          test "$(git -C .lake/packages/lean4export rev-parse HEAD)" = "$EXPORTER"
          lake build lean4export splitReplay
          git diff --exit-code -- Main.lean Comparator.lean Comparator/
          cp Main.lean SplitReplay.lean lakefile.toml lake-manifest.json "$GITHUB_WORKSPACE/evidence/"
          cp .lake/build/bin/splitReplay "$GITHUB_WORKSPACE/evidence/"
          ldd .lake/build/bin/splitReplay | tee "$GITHUB_WORKSPACE/evidence/checker-ldd.txt"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/comparator-commit.txt"
          git -C .lake/packages/lean4export rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/exporter-commit.txt"
      - name: Independently construct original challenge export
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$RUNNER_TEMP/split"
          mkdir -p challenge/ComparatorChallenges
          cd challenge
          base="https://raw.githubusercontent.com/openai/math/$UPSTREAM/lean"
          curl -fsSL "$base/lean-toolchain" -o lean-toolchain
          curl -fsSL "$base/lake-manifest.json" -o original-manifest.json
          curl -fsSL "$base/ComparatorChallenges/ArithmeticHierarchy.lean" -o ComparatorChallenges/ArithmeticHierarchy.lean
          curl -fsSL "$base/ComparatorChallenges/ArithmeticHierarchy.json" -o ArithmeticHierarchy.json
          test "$(git hash-object ComparatorChallenges/ArithmeticHierarchy.lean)" = 3d83fc143c44e8c8c01b163dcc84e898bc5aa01c
          test "$(git hash-object ArithmeticHierarchy.json)" = 826e1a5af6e25a458cfb26c09580479b23b7cccf
          echo 'b0848e3682e0e50761a717d4ea92a40321db8d695a22d3790b3e8b8b13814168  original-manifest.json' | sha256sum -c -
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.34.1
          cat > lakefile.lean <<'LEAN'
          import Lake
          open Lake DSL
          package GCLChallenge where
            fixedToolchain := true
            leanOptions := #[⟨`autoImplicit, false⟩]
          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "d13f23b723b8a846827a245b89c10fc7d3f11612"
          lean_lib ComparatorChallenges where
            globs := #[`ComparatorChallenges.+]
          LEAN
          lake update
          python3 - <<'PY'
          import json
          from pathlib import Path
          def lock(p):
              return {r['name']:(r['url'],r['rev']) for r in json.loads(Path(p).read_text())['packages']}
          a,b=lock('original-manifest.json'),lock('lake-manifest.json')
          assert set(b)=={'mathlib','plausible','LeanSearchClient','importGraph','proofwidgets','aesop','Qq','batteries','Cli'},b
          assert all(a[k]==v for k,v in b.items()),(a,b)
          print('Exact nine challenge dependency pins match original manifest')
          PY
          lake exe cache get
          lake build ComparatorChallenges.ArithmeticHierarchy
          exporter="$RUNNER_TEMP/split/checker/.lake/packages/lean4export/.lake/build/bin/lean4export"
          primitives=(Quot Quot.mk Quot.lift Quot.ind propext Quot.sound Classical.choice Nat.add Nat.sub Nat.mul Nat.pow Nat.gcd Nat.div Nat.mod Nat.beq Nat.ble Nat.land Nat.lor Nat.xor Nat.shiftLeft Nat.shiftRight String.ofList Char.ofNat List eagerReduce Nat String String.mk Char optParam autoParam semiOutParam outParam)
          lake env "$exporter" ComparatorChallenges.ArithmeticHierarchy -- OAI.Hierarchy.Valiant.strict_inclusions "${primitives[@]}" > "$RUNNER_TEMP/split/challenge.ndjson"
          gzip -1 -c "$RUNNER_TEMP/split/challenge.ndjson" > "$GITHUB_WORKSPACE/evidence/challenge.ndjson.gz"
          cp ArithmeticHierarchy.json ComparatorChallenges/ArithmeticHierarchy.lean lakefile.lean lean-toolchain original-manifest.json "$GITHUB_WORKSPACE/evidence/"
          cp lake-manifest.json "$GITHUB_WORKSPACE/evidence/challenge-manifest.json"
          sha256sum "$RUNNER_TEMP/split/challenge.ndjson" | cut -d' ' -f1 > "$GITHUB_WORKSPACE/evidence/challenge-uncompressed.sha256"
      - name: Positive and hostile proof controls
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$RUNNER_TEMP/split/challenge"
          out="$GITHUB_WORKSPACE/evidence"
          checker="$RUNNER_TEMP/split/checker/.lake/build/bin/splitReplay"
          exporter="$RUNNER_TEMP/split/checker/.lake/packages/lean4export/.lake/build/bin/lean4export"
          cat > ComparatorChallenges/ControlChallenge.lean <<'LEAN'
          theorem gclSplitProbe (n : Nat) : n + 0 = n := by sorry
          LEAN
          cat > ComparatorChallenges/ControlValid.lean <<'LEAN'
          theorem gclSplitProbe (n : Nat) : n + 0 = n := Nat.add_zero n
          LEAN
          cat > ComparatorChallenges/ControlMismatch.lean <<'LEAN'
          theorem gclSplitProbe (n : Nat) : n = n := rfl
          LEAN
          cat > ComparatorChallenges/ControlForbidden.lean <<'LEAN'
          axiom gclForbidden (n : Nat) : n + 0 = n
          theorem gclSplitProbe (n : Nat) : n + 0 = n := gclForbidden n
          LEAN
          cat > Control.json <<'JSON'
          {"challenge_module":"ComparatorChallenges.ControlChallenge","solution_module":"ComparatorChallenges.ControlValid","theorem_names":["gclSplitProbe"],"definition_names":[],"permitted_axioms":["propext","Quot.sound","Classical.choice"],"enable_nanoda":false}
          JSON
          primitives=(Quot Quot.mk Quot.lift Quot.ind propext Quot.sound Classical.choice Nat.add Nat.sub Nat.mul Nat.pow Nat.gcd Nat.div Nat.mod Nat.beq Nat.ble Nat.land Nat.lor Nat.xor Nat.shiftLeft Nat.shiftRight String.ofList Char.ofNat List eagerReduce Nat String String.mk Char optParam autoParam semiOutParam outParam)
          for v in Challenge Valid Mismatch Forbidden; do
            lake build "ComparatorChallenges.Control$v"
            lake env "$exporter" "ComparatorChallenges.Control$v" -- gclSplitProbe "${primitives[@]}" > "control-$v.ndjson"
          done
          lake env "$checker" Control.json control-Challenge.ndjson control-Valid.ndjson > "$out/control-valid.log" 2>&1
          grep -F 'Lean default kernel accepts the solution' "$out/control-valid.log"
          grep -F 'GCL SPLIT REPLAY ACCEPTED' "$out/control-valid.log"
          if lake env "$checker" Control.json control-Challenge.ndjson control-Mismatch.ndjson > "$out/control-mismatch.log" 2>&1; then exit 1; fi
          grep -F 'theorem statement do not match' "$out/control-mismatch.log"
          if lake env "$checker" Control.json control-Challenge.ndjson control-Forbidden.ndjson > "$out/control-forbidden.log" 2>&1; then exit 1; fi
          grep -F 'Illegal axiom detected' "$out/control-forbidden.log"
          if lake env "$checker" ArithmeticHierarchy.json "$RUNNER_TEMP/split/challenge.ndjson" "$RUNNER_TEMP/split/challenge.ndjson" > "$out/control-original-sorry.log" 2>&1; then exit 1; fi
          grep -F 'Illegal axiom detected' "$out/control-original-sorry.log"
          cp ComparatorChallenges/Control*.lean Control.json control-*.ndjson "$out/"
          printf '%s\n' 'All four checker controls passed. Original solution export not yet checked.' > "$out/preparation-status.txt"
          cd "$out"
          sha256sum * > SHA256SUMS
      - name: Retain independent challenge and verifier bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oai26-hierarchy-split-checker
          path: evidence/
          if-no-files-found: error
          retention-days: 30
