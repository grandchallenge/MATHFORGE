name: Forge checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconnaissance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Recompute small-family audit
        run: python domains/union_closed/enumerate_small_families.py
      - name: Confirm committed audit is reproducible
        run: git diff --exit-code
      - name: Validate JSON, witness budgets, provider coverage, and artifact identity
        run: python ci/validate_forge.py
      - name: Validate OpenAI Ten Proofs formal source successor
        run: python ci/validate_openai_ten_proofs_formal_source_successor.py
      - name: Validate EUCLID-GCD-E2E-001 provider package
        run: python ci/validate_euclid_gcd_forge.py
      - name: Validate EUCLID-DIOPHANTINE-E2E-002 provider package
        run: python ci/validate_euclid_diophantine_forge.py
      - name: Validate EUCLID-ELEMENTS-BOOK-VII-MICRO-001 source lock
        run: python ci/validate_euclid_book_vii_source_lock.py
      - name: Run discovery and adversarial contract tests
        run: python -m unittest discover -s tests -v
