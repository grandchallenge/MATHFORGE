name: OAI-26 F003 native idèle Hecke conductor-local Lean sidecar

on:
  pull_request:
    paths:
      - ".github/workflows/oai26-f003-native-idele-conductor.yml"
      - "sources/OPENAI-MATH-2026/formal/F003NativeHeckeConductorFactors.lean"
      - "sources/OPENAI-MATH-2026/formal/F003NativeIdeleUnramifiedQuotient.lean"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oai26-f003-native-idele-conductor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-idele-conductor:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GCL_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact GCL candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout separately pinned native mathlib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover-community/mathlib4
          ref: 6e96f3e25b9b23468a6f155342b5a1e5e33ac8f9
          path: upstream/mathlib-native
          fetch-depth: 1
          persist-credentials: false
      - name: Verify native-source lock and candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay/oai26-f003-native-idele
          test "$(git rev-parse HEAD)" = "$GCL_CANDIDATE_SHA"
          test "$(git -C upstream/mathlib-native rev-parse HEAD)" = "6e96f3e25b9b23468a6f155342b5a1e5e33ac8f9"
          test "$(git -C upstream/mathlib-native rev-parse HEAD^{tree})" = "b2c8b308b3b161ad602b52f65b125c724e060536"
          test "$(cat upstream/mathlib-native/lean-toolchain)" = "leanprover/lean4:v4.36.0-rc2"
          test "$(sha256sum upstream/mathlib-native/lake-manifest.json | cut -d' ' -f1)" = "de0f8c1467a6b313a7116d73cd3bcb390261d3d0a36bf246a13dbc0ad032d762"
          test "$(git -C upstream/mathlib-native hash-object Mathlib/NumberTheory/NumberField/HeckeLFunction.lean)" = "9dcd9a2a11f1407d47b9b0a1000259d237bdfe64"
          test -f sources/OPENAI-MATH-2026/formal/F003NativeHeckeConductorFactors.lean
          ! grep -Eq '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' sources/OPENAI-MATH-2026/formal/F003NativeHeckeConductorFactors.lean
          test -f sources/OPENAI-MATH-2026/formal/F003NativeIdeleUnramifiedQuotient.lean
          ! grep -Eq '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' sources/OPENAI-MATH-2026/formal/F003NativeIdeleUnramifiedQuotient.lean
          git rev-parse HEAD > replay/oai26-f003-native-idele/gcl-head.txt
          git -C upstream/mathlib-native rev-parse HEAD > replay/oai26-f003-native-idele/native-head.txt
          sha256sum sources/OPENAI-MATH-2026/formal/F003NativeHeckeConductorFactors.lean > replay/oai26-f003-native-idele/candidate.sha256
          sha256sum sources/OPENAI-MATH-2026/formal/F003NativeIdeleUnramifiedQuotient.lean > replay/oai26-f003-native-idele/quotient-source.sha256
          sha256sum upstream/mathlib-native/Mathlib/NumberTheory/NumberField/HeckeLFunction.lean > replay/oai26-f003-native-idele/native-hecke.sha256
          sha256sum upstream/mathlib-native/lake-manifest.json > replay/oai26-f003-native-idele/manifest-before.sha256
      - name: Install pinned elan bootstrap v1.4.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare locked mathlib native cache
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/mathlib-native
          {
            lake --version
            lake exe cache get
            test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "de0f8c1467a6b313a7116d73cd3bcb390261d3d0a36bf246a13dbc0ad032d762"
          } > "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/environment.log" 2>&1
      - name: Elaborate native-idèle conductor local factors and axioms
        shell: bash
        run: |
          set +e
          cd upstream/mathlib-native
          (
            set -euo pipefail
            # The newly introduced native module is not in the retained remote mathlib cache.
            # Build the exact pinned native module before compiling the GCL sidecar.
            lake build Mathlib.NumberTheory.NumberField.HeckeLFunction
            cp "$GITHUB_WORKSPACE/sources/OPENAI-MATH-2026/formal/F003NativeHeckeConductorFactors.lean" GCLF003NativeHeckeConductorFactors.lean
            cat >> GCLF003NativeHeckeConductorFactors.lean <<'LEAN'
          #check GCL.OAI26.F003.NativeConductor.localPolynomial_presentation_times_correction
          #print axioms GCL.OAI26.F003.NativeConductor.localPolynomial_presentation_times_correction
          #check GCL.OAI26.F003.NativeConductor.deletionCorrection_of_ramified
          #print axioms GCL.OAI26.F003.NativeConductor.deletionCorrection_of_ramified
          #check GCL.OAI26.F003.NativeConductor.one_sub_mul_ne_zero_of_norm_lt_one
          #print axioms GCL.OAI26.F003.NativeConductor.one_sub_mul_ne_zero_of_norm_lt_one
          #check GCL.OAI26.F003.NativeConductor.deletionCorrection_eval_ne_zero
          #print axioms GCL.OAI26.F003.NativeConductor.deletionCorrection_eval_ne_zero
          LEAN
            lake env lean GCLF003NativeHeckeConductorFactors.lean
            test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "de0f8c1467a6b313a7116d73cd3bcb390261d3d0a36bf246a13dbc0ad032d762"
          ) > "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/compiler.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/compile.exit"
          tail -n 160 "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/compiler.log"
          exit "$status"
      - name: Elaborate global native-idèle good-unit quotient and axioms
        shell: bash
        run: |
          set +e
          cd upstream/mathlib-native
          (
            set -euo pipefail
            cp "$GITHUB_WORKSPACE/sources/OPENAI-MATH-2026/formal/F003NativeIdeleUnramifiedQuotient.lean" GCLF003NativeIdeleUnramifiedQuotient.lean
            cat >> GCLF003NativeIdeleUnramifiedQuotient.lean <<'LEAN'
          #check GCL.OAI26.F003.NativeRaySkeleton.isUnramifiedAt_iff_restrictedUnitCharacter_one
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.isUnramifiedAt_iff_restrictedUnitCharacter_one
          #check GCL.OAI26.F003.NativeRaySkeleton.isUnramifiedAt_iff_range_le_ker
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.isUnramifiedAt_iff_range_le_ker
          #check GCL.OAI26.F003.NativeRaySkeleton.unramifiedOutside_iff_global_kernel
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.unramifiedOutside_iff_global_kernel
          #check GCL.OAI26.F003.NativeRaySkeleton.outsideUnitProjection_ker
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.outsideUnitProjection_ker
          #check GCL.OAI26.F003.NativeRaySkeleton.descendToOutsideUnitQuotient_comp
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.descendToOutsideUnitQuotient_comp
          #check GCL.OAI26.F003.NativeRaySkeleton.localPrincipalUnits
          #check GCL.OAI26.F003.NativeRaySkeleton.principalUnitImage
          #check GCL.OAI26.F003.NativeRaySkeleton.infinityUnitSubgroup
          #check GCL.OAI26.F003.NativeRaySkeleton.rayLevelTrivial_iff_global_kernel
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.rayLevelTrivial_iff_global_kernel
          #check GCL.OAI26.F003.NativeRaySkeleton.rayLevelProjection_ker
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.rayLevelProjection_ker
          #check GCL.OAI26.F003.NativeRaySkeleton.descendToRayLevel_comp
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.descendToRayLevel_comp
          #check GCL.OAI26.F003.NativeRaySkeleton.nativeCharacter_ker_isClosed
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.nativeCharacter_ker_isClosed
          #check GCL.OAI26.F003.NativeRaySkeleton.rayLevelTrivial_iff_closed_global_kernel
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.rayLevelTrivial_iff_closed_global_kernel
          #check GCL.OAI26.F003.NativeRaySkeleton.closedRayLevelProjection_ker
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.closedRayLevelProjection_ker
          #check GCL.OAI26.F003.NativeRaySkeleton.descendToClosedRayLevel_comp
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.descendToClosedRayLevel_comp
          #check GCL.OAI26.F003.NativeRaySkeleton.descendToClosedRayLevel_continuous
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.descendToClosedRayLevel_continuous
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdelePrimeExponent_eventually_zero
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdelePrimeExponent_eventually_zero
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_ne_zero
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_ne_zero
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_count
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_count
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_uniformizer_count
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_uniformizer_count
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_eq_one_iff
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_eq_one_iff
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_integral_count
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_integral_count
          #check GCL.OAI26.F003.NativeRaySkeleton.fractionalIdeal_eq_of_primeCounts_eq
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.fractionalIdeal_eq_of_primeCounts_eq
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdelePrimeExponent_mul
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdelePrimeExponent_mul
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_mul
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_mul
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleIdealUnitHom_mem_ker_iff
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleIdealUnitHom_mem_ker_iff
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_exists
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_exists
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleIdealUnitHom_surjective
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleIdealUnitHom_surjective
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_unitEmbedding
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdeleFractionalIdeal_unitEmbedding
          #check GCL.OAI26.F003.NativeRaySkeleton.mem_conductorNormalizedIdeles_iff
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.mem_conductorNormalizedIdeles_iff
          #check GCL.OAI26.F003.NativeRaySkeleton.conductorNormalizedIdeles_valuation_one
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.conductorNormalizedIdeles_valuation_one
          #check GCL.OAI26.F003.NativeRaySkeleton.conductorNormalizedIdeles_ideal_coprime
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.conductorNormalizedIdeles_ideal_coprime
          #check GCL.OAI26.F003.NativeRaySkeleton.conductorCoprimeIdealHom_surjective
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.conductorCoprimeIdealHom_surjective
          #check GCL.OAI26.F003.NativeRaySkeleton.rayPrincipalIdealHom_val
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.rayPrincipalIdealHom_val
          #check GCL.OAI26.F003.NativeRaySkeleton.normalizedIdeleRayHom_surjective
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.normalizedIdeleRayHom_surjective
          #check GCL.OAI26.F003.NativeRaySkeleton.normalizedIdeleRayHom_mem_ker_iff
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.normalizedIdeleRayHom_mem_ker_iff
          #check GCL.OAI26.F003.NativeRaySkeleton.normalizedIdeleRayEquiv
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.normalizedIdeleRayEquiv
          #check GCL.OAI26.F003.NativeRaySkeleton.finitePlace_approximate_field_targets
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finitePlace_approximate_field_targets
          #check GCL.OAI26.F003.NativeRaySkeleton.finitePlace_approximate_completion
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finitePlace_approximate_completion
          #check GCL.OAI26.F003.NativeRaySkeleton.finitePlace_simultaneous_approximation
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finitePlace_simultaneous_approximation
          #check GCL.OAI26.F003.NativeRaySkeleton.conductorLocalImage_of_small_sub_one
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.conductorLocalImage_of_small_sub_one
          #check GCL.OAI26.F003.NativeRaySkeleton.exists_nonzero_local_maximal_ideal_element
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.exists_nonzero_local_maximal_ideal_element
          #check GCL.OAI26.F003.NativeRaySkeleton.finiteIdele_exists_diagonal_conductor_normalization
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.finiteIdele_exists_diagonal_conductor_normalization
          #check GCL.OAI26.F003.NativeRaySkeleton.normalizedRay_choice_independent
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.normalizedRay_choice_independent
          #check GCL.OAI26.F003.NativeRaySkeleton.globalFiniteRayHom_surjective
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.globalFiniteRayHom_surjective
          #check GCL.OAI26.F003.NativeRaySkeleton.mem_fullFiniteRayUnits_iff
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.mem_fullFiniteRayUnits_iff
          #check GCL.OAI26.F003.NativeRaySkeleton.globalFiniteRayHom_mem_ker_iff
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.globalFiniteRayHom_mem_ker_iff
          #check GCL.OAI26.F003.NativeRaySkeleton.globalIdeleClassRayHom_surjective
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.globalIdeleClassRayHom_surjective
          #check GCL.OAI26.F003.NativeRaySkeleton.globalIdeleClassRayHom_ker_eq
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.globalIdeleClassRayHom_ker_eq
          #check GCL.OAI26.F003.NativeRaySkeleton.globalIdeleClassRayEquiv
          #print axioms GCL.OAI26.F003.NativeRaySkeleton.globalIdeleClassRayEquiv
          LEAN
            lake env lean GCLF003NativeIdeleUnramifiedQuotient.lean
            test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "de0f8c1467a6b313a7116d73cd3bcb390261d3d0a36bf246a13dbc0ad032d762"
          ) > "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/quotient-compiler.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/quotient-compile.exit"
          tail -n 140 "$GITHUB_WORKSPACE/replay/oai26-f003-native-idele/quotient-compiler.log"
          exit "$status"
      - name: Capture fail-closed exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay/oai26-f003-native-idele
          python3 - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          p=Path('replay/oai26-f003-native-idele')
          data={}
          for f in sorted(p.iterdir()):
              if f.is_file() and f.name!='receipt.json':
                  b=f.read_bytes()
                  data[f.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          (p/'receipt.json').write_text(json.dumps({
              'schema':'GCL-OAI26-F003-NATIVE-IDELE-CONDUCTOR-REPLAY/1',
              'gcl_head':(p/'gcl-head.txt').read_text().strip() if (p/'gcl-head.txt').exists() else None,
              'expected_head':os.environ.get('GCL_CANDIDATE_SHA'),
              'github_event_sha':os.environ.get('GITHUB_SHA'),
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'native_mathlib_commit':'6e96f3e25b9b23468a6f155342b5a1e5e33ac8f9',
              'native_hecke_source_blob':'9dcd9a2a11f1407d47b9b0a1000259d237bdfe64',
              'native_manifest_sha256':'de0f8c1467a6b313a7116d73cd3bcb390261d3d0a36bf246a13dbc0ad032d762',
              'compilation_exit':int((p/'compile.exit').read_text()) if (p/'compile.exit').exists() else None,
              'global_quotient_compilation_exit':int((p/'quotient-compile.exit').read_text()) if (p/'quotient-compile.exit').exists() else None,
              'files':data,
              'claim_boundary':'Native arithmetic ray quotient and full restricted-product kernel candidate; exact-head compilation is evidence only. NOT closure of the generated local images, global residue-congruence bridge, global Euler/analytic continuation, or seven-eighths theorem certification'
          },indent=2)+'\n')
          PY
      - name: Archive source lock, compiler, axioms and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oai26-f003-native-idele-conductor
          path: replay/oai26-f003-native-idele
          retention-days: 30
          if-no-files-found: error
