  - source_id: NS-CI-SRC-OPERATIONAL-LPS-2024
    title: A Priori Estimates for Solutions to Landau Equation Under Prodi-Serrin Like Criteria
    authors:
      - R. Alonso
      - V. Bagland
      - L. Desvillettes
      - B. Lods
    source_type: research_article_with_explicit_classical_theorem_statement
    primary_or_secondary: operational_secondary_statement
    canonical_url: https://doi.org/10.1007/s00205-024-01992-y
    theorem_location: Theorem 1.1
    language: English
    domain:
      - R3
    solution_class: two Leray-Hopf weak solutions with the same initial datum
    space_time_hypothesis: u belongs to L^r([0,T];L^q(R3)), 2/r + 3/q = 1, q in (3,infinity]
    instantiated_pair: r=4 and q=6
    conclusion:
      - uniqueness on the interval
      - strong solution on [0,T] when the initial datum belongs to H1
      - strong solution on [t_star,T] for every positive t_star when the initial datum belongs to L2
    audit_state: OPERATIONAL_STATEMENT_AUDITED
    limitations:
      - The theorem is restated as classical background in a paper whose main subject is the Landau equation.
      - Historical priority and original wording remain governed by the Prodi, Serrin, and Ladyzhenskaya records.

