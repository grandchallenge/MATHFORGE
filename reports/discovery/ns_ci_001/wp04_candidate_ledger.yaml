    route_termination: ALREADY_CLASSICAL_AND_SCALING_GAP_UNCLOSED

  - id: NS-CI-R014-D
    family: generic_flux_or_commutator_compensation
    state: REPLACED
    source_ids: [WP04-S-D1]
    disposition: Analytic substrate exists, but the generic candidate lacks a uniform scale-summable closure statement.
    replacement: NS-CI-R014-D1

  - id: NS-CI-R014-D1
    family: uniform_shell_flux_compensation
    state: PROVISIONAL_SHORTLIST
    exact_statement: An independently checkable shell-flux or commutator hypothesis implies a uniform compensated enstrophy inequality with theta less than one and a in L1_t.
    scaling_class: TO_BE_CERTIFIED
    nearest_known_theorem: Kato-Ponce commutator estimates provide substrate but not the required uniform continuum closure.
    source_ids: [WP04-S-D1]
    wp01_fixture_map: [FP-007_TARGETED, FP-008_TARGETED, FP-010_CLEAR_IF_UNIFORM]
    failure_modes: [tautological_interface, a_encodes_target_norm, nonuniform_cutoff_constant]
    novelty_disposition: UNDETERMINED_NO_CLAIM
    recommendation: SHORTLIST_WITH_FORMULATION_DEBT

  - id: NS-CI-R014-E
    family: generic_compact_support_extension
    state: REPLACED
    source_ids: [WP04-S-E1, WP04-S-E2]
    disposition: Density alone does not identify every Leray-Hopf limit; unrestricted stability may be as hard as global regularity.
    replacement: NS-CI-R014-E1

  - id: NS-CI-R014-E1
    family: uniform_compact_support_to_schwartz_bridge
    state: PROVISIONAL_SHORTLIST
    exact_statement: Uniform critical-integrability bounds under compactly supported approximation of a fixed Schwartz datum pass to a strong limit and then to every Leray-Hopf solution by weak-strong uniqueness.
    scaling_class: LOGICAL_BRIDGE_NOT_PRIMARY_SCALING_TARGET
    nearest_known_theorem: Stability results exist for selected global classes but do not provide the universal extension bridge.
    source_ids: [WP04-S-E1, WP04-S-E2]
    wp01_fixture_map: [FP-009_TARGETED, FP-013_CLEAR_IF_QUANTIFIERS_EXPLICIT, FP-014_CLEAR_IF_UNIVERSAL_IDENTIFICATION]
    failure_modes: [uniform_bound_assumes_original_theorem, topology_too_weak, failure_to_identify_all_weak_solutions]
    novelty_disposition: UNDETERMINED_NO_CLAIM
    recommendation: SHORTLIST_AS_BRIDGE_THEOREM

  - id: NS-CI-R014-F
    family: generic_symmetry_or_structural_class
    state: REJECTED
    source_ids: [WP04-S-F1]
