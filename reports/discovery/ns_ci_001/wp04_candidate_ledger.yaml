    family: critical_dissipation_wavenumber_integrability
    state: PROVISIONAL_SHORTLIST
    exact_statement: Lambda in L2_t implies finite L4_t L6_x critical integral.
    scaling_class: CRITICAL
    nearest_known_theorem: Lambda in L5/2_t is sufficient for regularity; every Leray-Hopf solution has Lambda in L1_t.
