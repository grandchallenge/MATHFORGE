    authors: [Steven Zucker]
    source_type: research_article
    primary_or_secondary: primary
    canonical_url: http://www.numdam.org/item/CM_1977__34_2_199_0/
    bibliographic_record: Compositio Mathematica 34 (1977), 199-209
    variety_class: smooth cubic hypersurfaces of complex dimension four
