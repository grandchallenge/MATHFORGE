  - source_id: HC-SRC-DELIGNE-ABSOLUTE-1980
    title: Hodge cycles on abelian varieties
    authors: [Pierre Deligne]
    source_type: research_article
    primary_or_secondary: primary
    canonical_url: https://publications.ias.edu/node/441
    bibliographic_record: Hodge Cycles, Motives, and Shimura Varieties, Lecture Notes in Mathematics 900 (1982), based on 1980 work
    claim_used:
      - Hodge classes on abelian varieties are absolute Hodge.
    audit_state: PRIMARY_METADATA_AND_RESULT_AUDITED
    limitations:
